<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi edge deployment architecture</title>
  <desc id="desc">Authorized remote devices use Tailscale to reach a Raspberry Pi 5, which runs Flask and xrdp, reads a PLC over Modbus TCP, and publishes to AWS IoT over MQTT TLS.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111b3f"/>
    </linearGradient>
    <linearGradient id="private" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow-private" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-cloud" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#c4b5fd"/>
    </marker>
    <style>
      .ui { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .caps { letter-spacing: 2px; }
      .ui text {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: text-reveal 850ms cubic-bezier(.2,.8,.2,1) both;
        animation-delay: var(--text-delay, 0s);
      }
      .edge-heading { --text-delay: .10s; }
      .tailnet-label { --text-delay: .28s; }
      .remote-title { --text-delay: .48s; }
      .remote-detail { --text-delay: .62s; }
      .tailscale-label { --text-delay: .78s; }
      .pi-kicker { --text-delay: .94s; }
      .pi-title { --text-delay: 1.08s; }
      .pi-detail { --text-delay: 1.22s; }
      .pi-service { --text-delay: 1.36s; }
      .plc-title { --text-delay: 1.52s; }
      .plc-detail { --text-delay: 1.66s; }
      .modbus-label { --text-delay: 1.82s; }
      .aws-title { --text-delay: 1.98s; }
      .aws-detail { --text-delay: 2.12s; }
      .cloud-label { --text-delay: 2.28s; }
      .legend-text { --text-delay: 2.44s; }
      .flow { stroke-dasharray: 7 13; animation: travel 4.5s linear infinite; stroke-linecap: round; }
      .liquid-shadow {
        stroke-dasharray: 120 55;
        animation: liquid-travel 3.8s linear infinite;
        stroke-linecap: round;
      }
      .node { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node2 { animation: float 4s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes text-reveal {
        0% { opacity: 0; transform: translateY(9px) scale(.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes travel { to { stroke-dashoffset: -100; } }
      @keyframes liquid-travel { to { stroke-dashoffset: -240; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        .ui text, .flow, .liquid-shadow, .node, .node2 { animation: none; opacity: 1; }
        .ui text { transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="430" rx="22" fill="#07111f"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#334155"/>
  <text x="42" y="42" class="ui caps edge-heading" font-size="12" font-weight="700" fill="#64748b">REFERENCE DEPLOYMENT  /  PRIVATE EDGE NETWORK</text>

  <!-- private network boundary -->
  <rect x="32" y="68" width="820" height="306" rx="20" fill="#0b1c2c" fill-opacity=".56" stroke="#2dd4bf" stroke-opacity=".45" stroke-dasharray="7 8"/>
  <text x="53" y="94" class="ui caps tailnet-label" font-size="11" font-weight="700" fill="#5eead4">TAILSCALE TAILNET  /  CONTROLLED ACCESS</text>

  <!-- remote devices -->
  <g class="ui node">
    <rect x="62" y="142" width="178" height="116" rx="16" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".65"/>
    <text x="151" y="174" class="remote-title" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">REMOTE DEVICES</text>
    <text x="151" y="199" class="remote-detail" text-anchor="middle" font-size="12" fill="#94a3b8">laptops · tablets · phones</text>
    <circle cx="112" cy="226" r="6" fill="#38bdf8"/>
    <circle cx="151" cy="226" r="6" fill="#5eead4"/>
    <circle cx="190" cy="226" r="6" fill="#a78bfa"/>
  </g>

  <!-- tailscale link -->
  <path d="M240 200 C 292 200, 300 200, 348 200" fill="none" stroke="#164e63" stroke-width="8" stroke-linecap="round"/>
  <path class="liquid-shadow" d="M240 200 C 292 200, 300 200, 348 200" fill="none" stroke="url(#private)" stroke-width="20" opacity=".16"/>
  <path class="flow" d="M240 200 C 292 200, 300 200, 348 200" fill="none" stroke="url(#private)" stroke-width="3" marker-end="url(#arrow-private)"/>
  <text x="294" y="181" text-anchor="middle" class="ui caps tailscale-label" font-size="10" fill="#67e8f9">Tailscale VPN</text>

  <!-- Raspberry Pi -->
  <g class="ui node2">
    <rect x="348" y="124" width="238" height="170" rx="18" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".75" stroke-width="1.5"/>
    <rect x="370" y="147" width="194" height="42" rx="10" fill="#102b42" stroke="#2dd4bf" stroke-opacity=".5"/>
    <text x="467" y="165" text-anchor="middle" class="ui caps pi-kicker" font-size="10" fill="#5eead4">EDGE HOST</text>
    <text x="467" y="183" text-anchor="middle" class="pi-title" font-size="16" font-weight="700" fill="#f8fafc">RASPBERRY PI 5</text>
    <text x="467" y="215" text-anchor="middle" class="pi-detail" font-size="12" fill="#cbd5e1">4 GB RAM · Tailscale</text>
    <rect x="372" y="230" width="88" height="35" rx="9" fill="#172554" stroke="#818cf8" stroke-opacity=".65"/>
    <text x="416" y="252" text-anchor="middle" class="pi-service" font-size="12" font-weight="600" fill="#c4b5fd">Flask UI/API</text>
    <rect x="474" y="230" width="88" height="35" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-opacity=".65"/>
    <text x="518" y="252" text-anchor="middle" class="pi-service" font-size="12" font-weight="600" fill="#99f6e4">xrdp :3389</text>
    <text x="467" y="284" text-anchor="middle" class="pi-detail" font-size="11" fill="#94a3b8">logger · certificates · runtime state</text>
  </g>

  <!-- PLC -->
  <g class="ui node">
    <rect x="656" y="139" width="164" height="116" rx="16" fill="#101b2d" stroke="#34d399" stroke-opacity=".7"/>
    <text x="738" y="174" text-anchor="middle" class="plc-title" font-size="16" font-weight="700" fill="#f8fafc">PLC</text>
    <text x="738" y="198" text-anchor="middle" class="plc-detail" font-size="12" fill="#94a3b8">site LAN</text>
    <text x="738" y="224" text-anchor="middle" class="plc-detail" font-size="11" fill="#6ee7b7">holding registers</text>
  </g>
  <path d="M586 200 C 612 200, 622 200, 656 200" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
  <path class="liquid-shadow" d="M586 200 C 612 200, 622 200, 656 200" fill="none" stroke="#34d399" stroke-width="18" opacity=".16"/>
  <path class="flow" d="M586 200 C 612 200, 622 200, 656 200" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-private)"/>
  <text x="621" y="181" text-anchor="middle" class="ui caps modbus-label" font-size="10" fill="#6ee7b7">MODBUS TCP / 502</text>

  <!-- AWS IoT outside private boundary -->
  <g class="ui node2">
    <rect x="920" y="137" width="218" height="120" rx="18" fill="#17152e" stroke="#a78bfa" stroke-opacity=".7"/>
    <text x="1029" y="174" text-anchor="middle" class="aws-title" font-size="16" font-weight="700" fill="#f8fafc">AWS IOT CORE</text>
    <text x="1029" y="199" text-anchor="middle" class="aws-detail" font-size="12" fill="#c4b5fd">MQTT / TLS / 8883</text>
    <text x="1029" y="224" text-anchor="middle" class="aws-detail" font-size="11" fill="#94a3b8">X.509 · topic policy</text>
  </g>
  <path d="M586 328 C 740 328, 780 210, 920 197" fill="none" stroke="#312e81" stroke-width="7" stroke-linecap="round"/>
  <path class="liquid-shadow" d="M586 328 C 740 328, 780 210, 920 197" fill="none" stroke="url(#cloud)" stroke-width="20" opacity=".14"/>
  <path class="flow" d="M586 328 C 740 328, 780 210, 920 197" fill="none" stroke="url(#cloud)" stroke-width="3" marker-end="url(#arrow-cloud)"/>
  <text x="758" y="300" text-anchor="middle" class="ui caps cloud-label" font-size="10" fill="#c4b5fd">OUTBOUND CLOUD LINK</text>

  <!-- legend -->
  <g class="ui" transform="translate(54 398)">
    <circle cx="6" cy="0" r="5" fill="#2dd4bf"/>
    <text x="20" y="4" class="legend-text" font-size="11" fill="#94a3b8">private site/operator path</text>
    <circle cx="208" cy="0" r="5" fill="#a78bfa"/>
    <text x="222" y="4" class="legend-text" font-size="11" fill="#94a3b8">AWS MQTT/TLS path</text>
    <text x="420" y="4" class="legend-text" font-size="11" fill="#64748b">No public PLC exposure · credentials stay local</text>
  </g>
</svg>
