<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Six-axis robotic arm motion study</title>
  <desc id="desc">An illustrative animated six-axis robotic arm picks and balances a payload, representing the workflow of building, testing, deploying, and improving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.6" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#15143a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.35" stop-color="#64748b"/>
      <stop offset="0.7" stop-color="#334155"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="armLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="payload" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93a9c9" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#67e8f9"/>
    </marker>
    <style>
      .ui { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .caps { letter-spacing: 2px; }
      .ui text {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: text-reveal 850ms cubic-bezier(.2,.8,.2,1) both;
        animation-delay: var(--delay, 0s);
      }
      .heading { --delay: .10s; }
      .title { --delay: .28s; }
      .subtitle { --delay: .52s; }
      .axis-label { --delay: 1.50s; }
      .card-label { --delay: .80s; }
      .card-value { --delay: .96s; }
      .card-detail { --delay: 1.12s; }
      .bottom-label { --delay: 1.72s; }
      .flow { stroke-dasharray: 8 16; animation: travel 3.8s linear infinite; }
      .trail { stroke-dasharray: 4 18; animation: travel 2.8s linear infinite; }
      .joint { animation: joint-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .joint-late { animation: joint-pulse 2.4s ease-in-out .8s infinite; transform-box: fill-box; transform-origin: center; }
      .status-dot { animation: status-pulse 1.8s ease-in-out infinite; }
      .bar-one { animation: bar 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .bar-two { animation: bar 2.4s ease-in-out .35s infinite; transform-box: fill-box; transform-origin: left center; }
      .bar-three { animation: bar 2.4s ease-in-out .7s infinite; transform-box: fill-box; transform-origin: left center; }
      @keyframes text-reveal { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes travel { to { stroke-dashoffset: -120; } }
      @keyframes joint-pulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes status-pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes bar { 0%,100% { transform: scaleX(.72); } 50% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .ui text, .flow, .trail, .joint, .joint-late, .status-dot, .bar-one, .bar-two, .bar-three { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#334155"/>
  <rect x="24" y="24" width="1152" height="472" rx="16" fill="url(#grid)"/>

  <text x="48" y="57" class="ui caps heading" font-size="12" font-weight="700" fill="#64748b">MOTION STUDY  /  ILLUSTRATIVE WORKFLOW</text>
  <text x="48" y="98" class="ui title" font-size="30" font-weight="800" fill="#f8fafc">BUILD  ·  TEST  ·  BALANCE</text>
  <text x="48" y="126" class="ui subtitle" font-size="14" fill="#94a3b8">A small motion metaphor for turning an idea into a dependable system.</text>

  <!-- floor and motion field -->
  <path d="M70 425H1130" stroke="#1e3a5f" stroke-width="2"/>
  <path d="M90 425C230 330 410 330 548 398S850 468 1110 350" fill="none" stroke="#164e63" stroke-width="2" stroke-dasharray="4 12" opacity=".7"/>
  <path class="trail" d="M90 425C230 330 410 330 548 398S850 468 1110 350" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".45"/>

  <!-- base -->
  <g>
    <ellipse cx="280" cy="425" rx="150" ry="22" fill="#0b1c31" stroke="#1e3a5f" stroke-width="2"/>
    <ellipse cx="280" cy="419" rx="105" ry="13" fill="#122544" stroke="#2dd4bf" stroke-opacity=".45"/>
    <rect x="220" y="350" width="120" height="70" rx="18" fill="#172554" stroke="#818cf8" stroke-opacity=".65"/>
    <rect x="242" y="366" width="76" height="25" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".45"/>
    <circle cx="280" cy="425" r="6" fill="#34d399" class="status-dot"/>
    <text x="280" y="465" text-anchor="middle" class="ui bottom-label" font-size="11" fill="#64748b">CONTROL BASE</text>
  </g>

  <!-- arm geometry: each group has a small balance motion around its joint -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 330 300;2 330 300;-3 330 300" dur="4.8s" repeatCount="indefinite"/>
    <path d="M330 300L470 170" fill="none" stroke="#0b172b" stroke-width="38" stroke-linecap="round"/>
    <path d="M330 300L470 170" fill="none" stroke="url(#metal)" stroke-width="25" stroke-linecap="round"/>
    <path d="M337 293L467 176" fill="none" stroke="#e2e8f0" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <circle class="joint" cx="330" cy="300" r="30" fill="#0f2534" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="330" cy="300" r="13" fill="#5eead4"/>
    <circle cx="330" cy="300" r="5" fill="#ecfeff"/>
    <text x="330" y="267" text-anchor="middle" class="ui axis-label" font-size="10" fill="#94a3b8">J1</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="4 470 170;-3 470 170;4 470 170" dur="4.2s" repeatCount="indefinite"/>
    <path d="M470 170L650 215" fill="none" stroke="#0b172b" stroke-width="34" stroke-linecap="round"/>
    <path d="M470 170L650 215" fill="none" stroke="url(#metal)" stroke-width="22" stroke-linecap="round"/>
    <path d="M480 169L644 210" fill="none" stroke="#e2e8f0" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <circle class="joint-late" cx="470" cy="170" r="29" fill="#111b3b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="470" cy="170" r="12" fill="#7dd3fc"/>
    <circle cx="470" cy="170" r="5" fill="#f0f9ff"/>
    <text x="470" y="137" text-anchor="middle" class="ui axis-label" font-size="10" fill="#94a3b8">J2</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 650 215;4 650 215;-3 650 215" dur="3.8s" repeatCount="indefinite"/>
    <path d="M650 215L730 190" fill="none" stroke="#0b172b" stroke-width="28" stroke-linecap="round"/>
    <path d="M650 215L730 190" fill="none" stroke="url(#metal)" stroke-width="17" stroke-linecap="round"/>
    <path d="M657 209L724 191" fill="none" stroke="#e2e8f0" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
    <circle class="joint" cx="650" cy="215" r="24" fill="#171b3b" stroke="#818cf8" stroke-width="3"/>
    <circle cx="650" cy="215" r="10" fill="#c4b5fd"/>
    <text x="650" y="253" text-anchor="middle" class="ui axis-label" font-size="10" fill="#94a3b8">J3</text>
  </g>

  <!-- wrist and gripper -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="3 730 190;-3 730 190;3 730 190" dur="3.4s" repeatCount="indefinite"/>
    <circle class="joint-late" cx="730" cy="190" r="20" fill="#211b46" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="730" cy="190" r="8" fill="#ddd6fe"/>
    <path d="M730 190L758 181M730 190L758 199" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <path d="M758 181L775 175M758 199L775 205" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <text x="730" y="226" text-anchor="middle" class="ui axis-label" font-size="10" fill="#94a3b8">J4–J6</text>
  </g>

  <!-- balanced payload -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 780 180;4 780 180;-4 780 180" dur="2.8s" repeatCount="indefinite"/>
    <path d="M780 158L803 170V194L780 206L757 194V170Z" fill="url(#payload)" stroke="#cffafe" stroke-width="2"/>
    <path d="M757 170L780 182L803 170M780 182V206" fill="none" stroke="#e0f2fe" stroke-opacity=".7" stroke-width="2"/>
    <circle cx="780" cy="182" r="4" fill="#f0fdfa"/>
  </g>
  <circle cx="780" cy="182" r="30" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="3 8">
    <animateTransform attributeName="transform" type="rotate" values="0 780 182;360 780 182" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- arm status card -->
  <g transform="translate(930 155)">
    <rect width="210" height="190" rx="18" fill="#0c1a2d" stroke="#334155"/>
    <text x="22" y="31" class="ui caps card-label" font-size="10" fill="#64748b">MOTION CONTROL</text>
    <text x="22" y="59" class="ui card-value" font-size="18" font-weight="700" fill="#f8fafc">6-AXIS ARM</text>
    <text x="22" y="82" class="ui card-detail" font-size="11" fill="#94a3b8">PICK  /  PLACE  /  BALANCE</text>
    <circle class="status-dot" cx="25" cy="108" r="5" fill="#34d399"/>
    <text x="38" y="112" class="ui card-detail" font-size="11" fill="#d1fae5">CONTROL LOOP ACTIVE</text>
    <rect x="22" y="132" width="166" height="7" rx="3.5" fill="#172554"/>
    <rect class="bar-one" x="22" y="132" width="166" height="7" rx="3.5" fill="#2dd4bf" opacity=".8"/>
    <rect x="22" y="148" width="166" height="7" rx="3.5" fill="#172554"/>
    <rect class="bar-two" x="22" y="148" width="166" height="7" rx="3.5" fill="#38bdf8" opacity=".8"/>
    <rect x="22" y="164" width="166" height="7" rx="3.5" fill="#172554"/>
    <rect class="bar-three" x="22" y="164" width="166" height="7" rx="3.5" fill="#a78bfa" opacity=".8"/>
  </g>

  <!-- workflow footer -->
  <g class="ui" font-size="11" text-anchor="middle">
    <text x="280" y="493" class="bottom-label" fill="#5eead4">LEARN</text>
    <text x="500" y="493" class="bottom-label" fill="#7dd3fc">BUILD</text>
    <text x="750" y="493" class="bottom-label" fill="#c4b5fd">DEPLOY</text>
    <text x="1000" y="493" class="bottom-label" fill="#a78bfa">IMPROVE</text>
  </g>
</svg>
