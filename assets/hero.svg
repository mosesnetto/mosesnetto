<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mosesnetto industrial telemetry and edge systems</title>
  <desc id="desc">An animated dark banner showing a signal moving from a PLC through a Raspberry Pi edge gateway to AWS IoT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111b3f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8ba4c7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .ui { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .caps { letter-spacing: 3px; }
      .dash { stroke-dasharray: 8 16; animation: travel 5s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-delay { animation: pulse 2.8s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes travel { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.16); } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#5eead4" stroke-opacity="0.22"/>
  <rect x="24" y="24" width="1152" height="312" rx="16" fill="url(#grid)"/>

  <circle cx="92" cy="74" r="2.5" fill="#a5f3fc" opacity=".75"/>
  <circle cx="178" cy="128" r="1.8" fill="#c4b5fd" opacity=".6"/>
  <circle cx="1030" cy="78" r="2.2" fill="#67e8f9" opacity=".8"/>
  <circle cx="1110" cy="164" r="1.7" fill="#5eead4" opacity=".65"/>
  <circle cx="960" cy="294" r="2" fill="#c4b5fd" opacity=".7"/>
  <circle cx="260" cy="304" r="1.6" fill="#67e8f9" opacity=".55"/>

  <g class="ui">
    <text x="64" y="70" class="caps" font-size="13" font-weight="700" fill="#5eead4">PRIVATE PREVIEW  /  EDGE SYSTEMS</text>
    <text x="62" y="139" font-size="48" font-weight="800" letter-spacing="1" fill="#f8fafc">MOSESNETTO</text>
    <text x="65" y="178" font-size="19" font-weight="500" fill="#cbd5e1">Industrial telemetry  ·  secure connectivity  ·  edge deployment</text>
    <text x="65" y="218" font-size="15" font-weight="600" fill="#67e8f9">MODBUS  →  RASPBERRY PI  →  AWS IOT</text>
    <text x="65" y="250" font-size="12" class="caps" fill="#94a3b8">MQTT / TLS  ·  TAILSCALE  ·  XRDP  ·  FLASK</text>
  </g>

  <g opacity=".9">
    <path d="M 54 294 C 170 294, 180 294, 276 294 S 402 294, 490 294 S 612 294, 700 294 S 824 294, 908 294 S 1046 294, 1146 294" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <path class="dash" d="M 54 294 C 170 294, 180 294, 276 294 S 402 294, 490 294 S 612 294, 700 294 S 824 294, 908 294 S 1046 294, 1146 294" fill="none" stroke="url(#signal)" stroke-width="3" marker-end="url(#arrow)"/>
    <circle class="pulse" cx="276" cy="294" r="8" fill="#2dd4bf" filter="url(#glow)"/>
    <circle class="pulse-delay" cx="700" cy="294" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="pulse" cx="1046" cy="294" r="7" fill="#a78bfa" filter="url(#glow)"/>
  </g>

  <g class="ui" font-size="11" text-anchor="middle">
    <g transform="translate(276 294)">
      <circle r="25" fill="#0f2534" stroke="#2dd4bf" stroke-opacity=".6"/>
      <path d="M -10 7 V -7 L 0 1 L 10 -7 V 7" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="48" fill="#94a3b8">PLC / MODBUS</text>
    </g>
    <g transform="translate(700 294)">
      <rect x="-34" y="-25" width="68" height="50" rx="10" fill="#122544" stroke="#38bdf8" stroke-opacity=".7"/>
      <path d="M -18 -11 H 18 M -18 0 H 18 M -18 11 H 7" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="17" cy="11" r="3" fill="#5eead4"/>
      <text y="48" fill="#94a3b8">PI 5 EDGE</text>
    </g>
    <g transform="translate(1046 294)">
      <path d="M -21 10 C -26 -4 -14 -9 -7 -3 C -2 -19 19 -17 20 -2 C 32 -1 32 16 21 16 H -18 C -25 16 -26 11 -21 10Z" fill="#211b46" stroke="#a78bfa" stroke-opacity=".8"/>
      <path d="M -9 3 H 10 M -9 9 H 4" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <text y="48" fill="#94a3b8">AWS IOT</text>
    </g>
  </g>

  <g class="ui" transform="translate(1000 62)">
    <rect width="142" height="58" rx="12" fill="#0c1a2d" stroke="#334155"/>
    <text x="16" y="22" class="caps" font-size="10" fill="#64748b">BUILD MODE</text>
    <circle cx="18" cy="41" r="4" fill="#34d399" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="31" y="45" font-size="12" font-weight="700" fill="#d1fae5">PRIVATE &amp; REAL</text>
  </g>
</svg>
